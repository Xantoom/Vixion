[package]
name = "vixion"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
description = "Self-hosted Twitch stream recorder with a web interface."
repository = "https://github.com/Xantoom/Vixion"
publish = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4"
hmac = "0.13.0"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "query"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = { version = "8.14.0", features = ["include-exclude", "mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "time", "sync", "io-util", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower-http = { version = "0.7.1", default-features = false, features = ["compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mimalloc = "0.1.52"
