# Vixion: `mkdir config recordings && docker compose up -d`, then open http://your-server:8080.
services:
  vixion:
    image: ghcr.io/xantoom/vixion:latest
    container_name: vixion
    restart: unless-stopped
    # The owner of ./config and ./recordings on the host (`id -u` and `id -g`).
    user: "1000:1000"
    # Gives recordings in progress time to close their files on `docker compose down`.
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    volumes:
      # Database, keys and certificates.
      - ./config:/config
      # The recordings: put this on a large disk.
      - ./recordings:/recordings
    environment:
      # Recommended: a Twitch account's auth-token, ideally with Turbo (see the README).
      VIXION_TWITCH_TOKEN: ""
