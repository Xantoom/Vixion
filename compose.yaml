# Vixion: `mkdir data && docker compose up -d`, then open http://your-server:8080.
services:
  vixion:
    image: ghcr.io/xantoom/vixion:latest
    container_name: vixion
    restart: unless-stopped
    # The owner of ./data on the host (`id -u` and `id -g`).
    user: "1000:1000"
    # Gives recordings in progress time to close their files on `docker compose down`.
    stop_grace_period: 30s
    ports:
      - "8080:8080"
      # - "8443:8443"   # only with VIXION_MEDIA_MODE https or http
    volumes:
      - ./data:/data
    environment:
      # Recommended: a Twitch account's auth-token, ideally with Turbo (see the README).
      VIXION_TWITCH_TOKEN: ""
      # Optional: serve video on its own port, out of a Cloudflare Tunnel (see the README).
      # VIXION_MEDIA_MODE: https
      # VIXION_MEDIA_DOMAIN: media.example.com
      # VIXION_CLOUDFLARE_API_TOKEN: ""
