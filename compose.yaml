# Vixion: `mkdir config recordings && docker compose up -d`, then open http://your-server:6280.
services:
  vixion:
    image: ghcr.io/xantoom/vixion:latest
    container_name: vixion
    restart: unless-stopped
    # The owner of ./config and ./recordings on the host (`id -u` and `id -g`).
    user: "1000:1000"
    # Gives recordings in progress time to close their files on `docker compose down`.
    stop_grace_period: 30s
    # Vixion writes only to its two folders and needs no privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      # The interface, then the video: two ports, so the video never goes through a tunnel.
      - "6280:6280"
      - "6281:6281"
    volumes:
      # Database, keys and certificates.
      - ./config:/config
      # The recordings: put this on a large disk.
      - ./recordings:/recordings
    environment:
      # Required: a Twitch account's auth-token, ideally with Turbo (see the README).
      VIXION_TWITCH_TOKEN: ""
