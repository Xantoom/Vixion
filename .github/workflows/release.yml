name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # The tag, the crate and the web package must say the same version, and the changelog must
  # have a section for it: `bun scripts/release.ts` does all of this.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^version = \"$version\"" server/Cargo.toml || { echo "server/Cargo.toml is not $version"; exit 1; }
          grep -q "\"version\": \"$version\"" web/package.json || { echo "web/package.json is not $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

  web:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # Static binaries, each built on its own architecture: no emulation, no cross toolchain.
  binary:
    needs: web
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            docker: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - run: |
          mkdir -p out/${{ matrix.docker }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/vixion out/${{ matrix.docker }}/vixion
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/vixion vixion-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.docker }}
          path: |
            out
            vixion-linux-${{ matrix.arch }}

  publish:
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Make the binaries executable
        run: chmod +x out/*/vixion vixion-linux-*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release (1.2.0-rc.1) never becomes `latest`.
          if [[ $version == *-* ]]; then
            echo "tags=$image:$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:$version,$image:${version%.*},$image:latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # The release notes are the version's section of the changelog.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: / {exit} on' CHANGELOG.md > notes.md
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: softprops/action-gh-release@v2
        with:
          name: Vixion ${{ steps.meta.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: vixion-linux-*
