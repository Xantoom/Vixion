name: Release

on:
  push:
    tags: ['v*']

# Nothing by default: each job asks for what it needs, and only publish can write.
permissions: {}

# Actions are pinned by commit; Dependabot proposes their updates.
jobs:
  # Every check of the CI, whatever changed: a tag on a broken commit publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read

  # The tag, the crate and the web package must say the same version, and the changelog must
  # have a section for it: `bun scripts/release.ts` does all of this.
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^version = \"$version\"" server/Cargo.toml || { echo "server/Cargo.toml is not $version"; exit 1; }
          grep -q "\"version\": \"$version\"" web/package.json || { echo "web/package.json is not $version"; exit 1; }
          grep -qF "## [$version]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

  web:
    needs: [ci, check]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  # Static binaries, each built on its own architecture: no emulation, no cross toolchain.
  binary:
    needs: web
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker: amd64
            runner: ubuntu-26.04
          - arch: aarch64
            docker: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # The version is rust-toolchain.toml's.
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - run: |
          mkdir -p out/${{ matrix.docker }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/vixion out/${{ matrix.docker }}/vixion
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/vixion vixion-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.docker }}
          path: |
            out
            vixion-linux-${{ matrix.arch }}

  publish:
    needs: binary
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the GitHub release
      packages: write # the images
      id-token: write # signing the attestations
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Make the binaries executable and list their checksums
        run: |
          chmod +x out/*/vixion vixion-linux-*
          sha256sum vixion-linux-* > SHA256SUMS
      # `gh attestation verify vixion-linux-x86_64 --repo Xantoom/Vixion` proves where a binary was built.
      # GitHub keeps attestations only for public repositories (or organization plans).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: vixion-linux-*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${GITHUB_REF_NAME#v}
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release (1.2.0-rc.1) never becomes `latest`.
          if [[ $version == *-* ]]; then
            echo "tags=$image:$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:$version,$image:${version%.*},$image:latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # The release notes are the version's section of the changelog.
          awk -v heading="## [$version]" 'index($0, heading) == 1 {on=1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: / {exit} on' CHANGELOG.md > notes.md
      # The release image only copies files, so both architectures build without emulation.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Shown on the package page, which reads the multi-architecture index.
          annotations: |
            index:org.opencontainers.image.title=Vixion
            index:org.opencontainers.image.description=Records the Twitch channels you follow, chat included, and plays them back in your browser.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=AGPL-3.0-only
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Vixion ${{ steps.meta.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            vixion-linux-*
            SHA256SUMS
