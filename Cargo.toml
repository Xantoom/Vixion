[workspace]
resolver = "3"
members = ["server"]

# Small and fast: the binary runs for months on small machines.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding, so that a panic ends one recording (which is then repaired) and not the whole server.
panic = "unwind"
strip = true

# Development builds keep no debug info, which divides the target folder's size several times.
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

# For CI tests: quick to build, still optimised enough to run the parsers on real samples.
[profile.ci]
inherits = "dev"
incremental = false
